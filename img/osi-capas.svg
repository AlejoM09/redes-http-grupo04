<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-label="Las 7 capas del modelo OSI, con la capa 7 de aplicación resaltada">
<rect x="10" y="10" width="500" height="70" rx="6" fill="#00798C"/>
<text x="30" y="53.0" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#FFFFFF">7</text>
<text x="70" y="51.0" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">Aplicación</text>
<text x="498" y="51.0" text-anchor="end" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#FFFFFF">HTTP, DNS</text>
<rect x="10" y="88" width="500" height="52" rx="6" fill="#C9D6E3"/>
<text x="30" y="122.0" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#101B2D">6</text>
<text x="70" y="120.0" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#101B2D">Presentación</text>
<text x="498" y="120.0" text-anchor="end" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#101B2D">codificación, TLS</text>
<rect x="10" y="148" width="500" height="52" rx="6" fill="#C9D6E3"/>
<text x="30" y="182.0" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#101B2D">5</text>
<text x="70" y="180.0" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#101B2D">Sesión</text>
<text x="498" y="180.0" text-anchor="end" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#101B2D">diálogo entre procesos</text>
<rect x="10" y="208" width="500" height="52" rx="6" fill="#B3C4D8"/>
<text x="30" y="242.0" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#101B2D">4</text>
<text x="70" y="240.0" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#101B2D">Transporte</text>
<text x="498" y="240.0" text-anchor="end" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#101B2D">TCP, UDP</text>
<rect x="10" y="268" width="500" height="52" rx="6" fill="#B3C4D8"/>
<text x="30" y="302.0" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#101B2D">3</text>
<text x="70" y="300.0" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#101B2D">Red</text>
<text x="498" y="300.0" text-anchor="end" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#101B2D">IPv4, IPv6, OSPF</text>
<rect x="10" y="328" width="500" height="52" rx="6" fill="#9DB2CB"/>
<text x="30" y="362.0" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#101B2D">2</text>
<text x="70" y="360.0" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#101B2D">Enlace</text>
<text x="498" y="360.0" text-anchor="end" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#101B2D">Ethernet, MAC</text>
<rect x="10" y="388" width="500" height="52" rx="6" fill="#9DB2CB"/>
<text x="30" y="422.0" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#101B2D">1</text>
<text x="70" y="420.0" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#101B2D">Física</text>
<text x="498" y="420.0" text-anchor="end" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#101B2D">cobre, Wi-Fi</text>
</svg>